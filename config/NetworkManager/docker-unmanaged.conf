# kosetup work-cli/docker-nm — installed to /etc/NetworkManager/conf.d/
#
# Leave Docker's interfaces to Docker. Without this, NetworkManager treats every
# docker bridge (docker0, the per-Aspire-session br-<hash>) and container veth as
# a device of its own: it auto-creates connection profiles, activates them, and
# churns through unmanaged/unavailable/prepare/config state changes every time a
# dev stack starts or stops. That churn is what the desktop sees as a network
# change — measured on the ROG: Teams for Linux exited 1-10 s after every Aspire
# teardown, 4/4 times, with no crash of its own. Docker configures these
# interfaces itself and never needs NetworkManager for them.
[keyfile]
unmanaged-devices=interface-name:docker0;interface-name:br-*;interface-name:veth*
