# Dedicated tmux config for the `n` preview wrapper (isolated `-L nnn` server).
# Inherits the main tmux config IF the machine has one (-q: skip quietly if not).
source-file -q ~/.config/tmux/tmux.conf

set -g mouse on                           # wheel scroll works even with no main config
set -g status off                         # no status bar while browsing in nnn

# Near-invisible preview divider: dim brightblack (ANSI slot 8) rides the
# terminal palette. Active and inactive match — kills the default bright-green
# active-border highlight.
set -g pane-border-style 'fg=colour8,dim'
set -g pane-active-border-style 'fg=colour8,dim'

# Scroll the preview pane from the nnn pane WITHOUT moving focus.
# NNN_SPLIT=v forces the preview to be the pane on the right, so we target
# '{right-of}'. less (NNN_PAGER) receives the keys and scrolls.
bind -n M-j send-keys -t '{right-of}' Down   # preview: line down
bind -n M-k send-keys -t '{right-of}' Up     # preview: line up
bind -n M-d send-keys -t '{right-of}' C-d    # preview: half-page down
bind -n M-u send-keys -t '{right-of}' C-u    # preview: half-page up
# horizontal scroll on Alt+arrows, NOT Alt+h/l: GTK terminals grab Alt+h (Help
# mnemonic) before tmux sees it. Arrows pass through cleanly.
bind -n M-Right send-keys -t '{right-of}' Right  # preview: scroll right
bind -n M-Left  send-keys -t '{right-of}' Left   # preview: scroll left
